{
  "plugin_type": "extractors",
  "name": "tap-snowflake",
  "namespace": "tap_snowflake",
  "variant": "meltanolabs",
  "label": "Snowflake",
  "repo": "https://github.com/MeltanoLabs/tap-snowflake",
  "pip_url": "meltanolabs-tap-snowflake~=0.5.3",
  "description": "Snowflake is a cloud data platform that provides a relational SQL data warehouse. Storage,\ncompute (a \"warehouse\") and cloud services scale independently, and an account runs on AWS,\nAzure or Google Cloud.\n\nThis tap reads tables and views from a Snowflake database through the [Snowflake SQLAlchemy\ndialect](https://docs.snowflake.com/en/developer-guide/python-connector/sqlalchemy). It runs\nevery query against the warehouse that you configure, so an extraction [consumes compute\ncredits](https://docs.snowflake.com/en/user-guide/cost-understanding-compute).\n\n## Streams\n\nStreams are discovered dynamically at runtime. Each table and view in the configured database\nbecomes a stream named `<schema>-<table>`; a column of that stream is selected as\n`<schema>-<table>.<column>`. The `information_schema` schema is excluded from discovery.\n\nDiscovery reflects every schema of the database, so a large account produces a large catalog.\nStep 5 below limits it to the objects that you need.\n\n## Setup\n\n### 1. Create a role and a user\n\nCreate a dedicated [role](https://docs.snowflake.com/en/user-guide/security-access-control-overview)\nand [user](https://docs.snowflake.com/en/sql-reference/sql/create-user) for the tap, then\n[grant](https://docs.snowflake.com/en/sql-reference/sql/grant-privilege) read access to the\nobjects that you extract. The role needs `USAGE` on the warehouse, on the database, and on each\nschema that discovery reads:\n\n```sql\nUSE ROLE ACCOUNTADMIN;\n\nCREATE ROLE tap_snowflake;\nCREATE USER tap_snowflake\n  PASSWORD = '<password>'\n  DEFAULT_ROLE = tap_snowflake\n  DEFAULT_WAREHOUSE = <warehouse>;\nGRANT ROLE tap_snowflake TO USER tap_snowflake;\n\nGRANT USAGE ON WAREHOUSE <warehouse> TO ROLE tap_snowflake;\nGRANT USAGE ON DATABASE <database> TO ROLE tap_snowflake;\nGRANT USAGE ON ALL SCHEMAS IN DATABASE <database> TO ROLE tap_snowflake;\nGRANT USAGE ON FUTURE SCHEMAS IN DATABASE <database> TO ROLE tap_snowflake;\nGRANT SELECT ON ALL TABLES IN DATABASE <database> TO ROLE tap_snowflake;\nGRANT SELECT ON FUTURE TABLES IN DATABASE <database> TO ROLE tap_snowflake;\nGRANT SELECT ON ALL VIEWS IN DATABASE <database> TO ROLE tap_snowflake;\nGRANT SELECT ON FUTURE VIEWS IN DATABASE <database> TO ROLE tap_snowflake;\n```\n\nThe [`FUTURE` grants](https://docs.snowflake.com/en/user-guide/security-access-control-configure#defining-future-grants-on-database-or-schema-objects)\ncover an object that someone creates after this point. Without them, a new table is discovered\nbut returns a permission error on extraction.\n\n### 2. Find your account identifier\n\nThe Account setting takes an account identifier, such as `myorg-account1`. See [Account\nIdentifiers](https://docs.snowflake.com/en/user-guide/admin-account-identifier). Do not include\nthe `.snowflakecomputing.com` suffix.\n\nA [network policy](https://docs.snowflake.com/en/user-guide/network-policies) on the account or\non the user restricts the addresses that may connect. Add the address that the pipeline runs\nfrom to the allowed list, or Snowflake rejects the connection before it authenticates.\n\n### 3. Choose an authentication method\n\nSet exactly one of Password, Private Key or Private Key Path. The tap stops with a\nconfiguration error when more than one of the three is set.\n\n**Password** \u2014 enter the password of the Snowflake user.\n\n**Key pair** \u2014 [key pair authentication](https://docs.snowflake.com/en/user-guide/key-pair-auth)\nreplaces the password with an RSA key. Follow [Configuring key pair authentication](https://docs.snowflake.com/en/user-guide/key-pair-auth#configuring-key-pair-authentication)\nto generate the key pair and to [assign the public key to the Snowflake user](https://docs.snowflake.com/en/user-guide/key-pair-auth#assign-the-public-key-to-a-snowflake-user).\n\nGive the private key to the tap in one of two ways. The Private Key setting holds the base64\nencoded contents of the private key file, which the platform decodes back to PEM before the tap\nreads it:\n\n```sh\nbase64 -w0 rsa_key.p8\n```\n\nPrivate Key Path points at a key file on disk instead, so it suits a self-hosted run rather\nthan a hosted pipeline, which has no persistent filesystem to hold the key. Set Private Key\nPassphrase as well when the key carries a passphrase.\n\n**Browser SSO** \u2014 Use Browser Authentication authenticates through your identity provider with\n[browser-based SSO](https://docs.snowflake.com/en/user-guide/admin-security-fed-auth-use#browser-based-sso),\nwhich opens an external browser. The prompt needs a person to answer it, so this option fits an\ninteractive local run only. It also takes precedence over the three credential settings above.\n\n### 4. Set the session context\n\nWarehouse, Database, Role and Schema set the initial context of the Snowflake session. Set\nWarehouse to the [warehouse](https://docs.snowflake.com/en/user-guide/warehouses-overview) that\nruns the queries, and Database to the database that holds the objects. Set Role when the user\nholds more than one role, because a query that runs under the wrong role sees a different set of\nobjects. Schema sets the initial schema only and does not restrict discovery.\n\n### 5. Limit discovery to the objects you need (optional)\n\nThe Tables setting limits discovery to the objects that you list, which keeps a large account\nfrom producing a catalog of every table and view. Fully qualify each entry as\n`<schema>.<table>`:\n\n```yml\ntables:\n- sales.orders\n- sales.customers\n```\n\nNote that the syntax differs from `select`, which separates the schema and the table with a\nhyphen. When you add a stream to `select`, add the same object to Tables as well, or discovery\nwill not produce it.\n\n### 6. Replicate incrementally (optional)\n\nA stream is replicated in full on each run. To replicate a stream incrementally, set a\nreplication key for it under `metadata` in your `meltano.yml`:\n\n```yml\nplugins:\n  extractors:\n  - name: tap-snowflake\n    variant: meltanolabs\n    pip_url: meltanolabs-tap-snowflake~=0.5.3\n    metadata:\n      <schema>-<table>:\n        replication-method: INCREMENTAL\n        replication-key: <column>\n        key-properties: [<column>]\n```\n\nUse a replication key that never decreases, such as an updated timestamp or an ascending key.\nThe tap resumes with `where <replication-key> >= <bookmark>`, so the rows that sit on the\nbookmark are sent again on the next run. Set `key-properties` as well, so that the target\nreplaces those rows instead of duplicating them. Snowflake does not enforce a primary key\nconstraint, so discovery finds no key properties for a stream and cannot supply them itself.\n\n### 7. Preserve numeric precision (optional)\n\nSet Use Singer Decimal to emit a `NUMBER` column as a string with the `x-singer.decimal`\nformat. A [`NUMBER`](https://docs.snowflake.com/en/sql-reference/data-types-numeric) column\nholds up to 38 digits of precision, which a JSON number cannot carry without loss.\n\n### 8. Enable BATCH mode for large tables (optional)\n\nInstead of one record message per row, the tap can write files and emit batch messages, which a\ncompatible target loads in bulk. Set Batch Encoding Format and Batch Compression Format, plus\nBatch Storage Root and Batch Storage Prefix for the location of the files.\n\nSet Batch Encoding Format to Arrow to fetch query results directly in Arrow format from\nSnowflake (via the Snowflake driver's native Arrow result support) and write them to Arrow IPC\nfiles, with no intermediate stage unload/download or JSON round trip. JSONL instead unloads\nrows to the Snowflake-managed internal user stage with `COPY INTO`, then downloads them \u2014 set\nBatch Compression Format for that path only; Arrow ignores it.\n\n> **Caveats** \u2014 batch messages do not support `INCREMENTAL` replication in this variant, so a\n> stream in BATCH mode is replicated in full, for both Arrow and JSONL. Only a target that\n> advertises the `batch` capability processes the messages; leave these settings unset for any\n> other target.\n",
