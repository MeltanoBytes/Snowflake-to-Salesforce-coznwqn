      "kind": "options",
      "value": "upsert",
      "label": "Action",
      "description": "How to handle incoming records by default:\n\n- `insert` creates records (no `Id`; fields must be createable)\n- `update` modifies records matched by `Id` (fields must be updateable)\n- `upsert` updates on an `Id` match and inserts otherwise (fields must be createable and\n  updateable)\n- `delete` moves records to the Recycle Bin by `Id`\n- `hard_delete` permanently removes records by `Id`, and needs the Bulk API Hard Delete\n  permission\n\nSalesforce enforces these rules in the Bulk job, so a mismatch surfaces as a Bulk job error.\n",
