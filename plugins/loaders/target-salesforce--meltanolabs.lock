  "description": "Salesforce is a cloud-based customer relationship management (CRM) platform that helps\nbusinesses manage their sales, marketing, and customer service activities in one place. This\nloader writes records into Salesforce objects through the Bulk API 2.0, with `insert`,\n`update`, `upsert`, `delete`, and `hard_delete` actions.\n\n### Prerequisites\n\nThe authenticating user needs the **API Enabled** permission, plus object and field-level\naccess that matches the configured `action`.\n\nAuthenticate with one of three credential sets. When more than one is provided, the target\nselects JWT bearer, then OAuth refresh-token, then username/password.\n\n- **JWT bearer** (`jwt_client_id`, `jwt_username`, `jwt_private_key`) \u2014 create a Connected or\n  External Client App with the \"Use digital signatures\" option, upload an X.509 certificate\n  whose private key you control, pre-authorize the user through a profile or permission set,\n  and ensure the user has consented to the app once through the browser OAuth flow.\n  Recommended for unattended, server-to-server use. See the\n  [JWT bearer flow docs](https://help.salesforce.com/s/articleView?id=xcloud.remoteaccess_oauth_jwt_flow.htm).\n- **OAuth refresh-token** (`client_id`, `client_secret`, `refresh_token`) \u2014 create a\n  Salesforce connected app to obtain the client ID, client secret, and refresh token. See the\n  [web server OAuth flow](https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_understanding_web_server_oauth_flow.htm).\n- **Username/password** (`username`, `password`, `security_token`) \u2014 obtain the security token\n  with Reset My Security Token in personal settings (not needed if the login IP is in the\n  org's trusted IP ranges). This flow uses a SOAP `login()` call, which new orgs disable by\n  default, so grant the user the **Use Any API Auth** permission through a permission set. This\n  flow is deprecated, so prefer JWT bearer or OAuth.\n\n### Data requirements\n\nIncoming records map to Salesforce objects by name, and Salesforce rejects a batch that does\nnot line up:\n\n- The stream name must match the target object's API name (case-insensitive), for example\n  `Account` or a custom object like `Invoice__c`.\n- Each property name must match a field's API name on that object (case-insensitive),\n  including the `__c` suffix for custom fields. An unknown field fails the batch with\n  `InvalidBatch: Field name not found`.\n- For the default `upsert` action, include each record's `Id` \u2014 a valid 15- or 18-character\n  Salesforce record ID \u2014 so the record updates its object. A blank `Id` inserts a new record,\n  and a malformed or non-existent `Id` fails the record. The upsert always keys on `Id`,\n  regardless of the stream's key properties.\n- For a `date` or `date-time` field, match the property name to the field's API name exactly,\n  including case. The target formats those values for Salesforce only on an exact match.\n",
  "logo_url": "/assets/logos/loaders/salesforce.png",
